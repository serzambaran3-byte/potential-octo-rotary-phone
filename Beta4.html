<script>
const $=i=>document.getElementById(i),R=n=>Math.floor(Math.random()*n);
const MODELS=['Samsung S20','Samsung S21','Samsung S22','Samsung S23','Samsung S24','Samsung S25','Samsung S26','Xiaomi 10 Ultra','Xiaomi 11 Ultra','Xiaomi 12S Ultra','Xiaomi 13 Ultra','Xiaomi 14 Ultra'];

/* ===== AUDIO ===== */
let ac;const A=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();return ac};
function beep(f,d=.12,t='square',v=.06,w=0){if(!S.sfx)return;try{const a=A(),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+w+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+w);o.stop(a.currentTime+w+d+.02)}catch(e){}}

const NOTES=[262,330,392,330,294,349,440,349,262,330,392,523,494,392,330,262];let ni=0;

 if(i==1)rCases();if(i==2)rBrowser();if(i==3)rQuests();if(i==4)rCustom();if(i==5)rShop();if(i==6)rMarket();if(i==7)rInv();if(i==0)rRepair()}

let screws=4,stg=0,tool='hand',instQ=0,fixed=false,found=false,front=false,heat=0,scrFront=false,bsc=4,testing=false,okd=new Set(),st=[];

 if(!w)return;clearInterval(pint);cap.textContent='';

 if(PS.m=='open'){w.innerHTML='<div class="pc">🔧<br>Телефон разобран</div>';cap.textContent='Соберите телефон и закройте крышку, чтобы включить его';return}
 if(PS.m=='dead'){w.innerHTML='<div class="blk"></div>';cap.textContent='Телефон не включается: ни реакции, ни зарядки';return}
 if(PS.m=='blank'){w.innerHTML='<div class="blk" onclick="beep(660,.15)"><svg viewBox="0 0 100 190" preserveAspectRatio="none"><path d="M70 0L52 60L30 90L40 140L20 190M52 60L90 100L100 130M30 90L0 80M40 140L80 170" stroke="#9ab" stroke-width="1" fill="none"/></svg></div>';cap.textContent='Экран разбит, картинки нет. Нажмите на экран: звук есть, значит телефон работает';return}
 if(PS.m=='bdead'){w.innerHTML='<div class="blk"></div>';cap.textContent='Телефон выключился: аккумулятор не держит заряд';return}
 if(pap=='boot'){w.innerHTML='<div class="pc boot">'+c.m+'</div>';cap.textContent='Загрузка…';sfx.ok();PS.t=setTimeout(()=>{pap='home';prender()},1500);return}
 if(PS.m=='batt'&&!PS.armed){PS.armed=1;PS.t=setTimeout(()=>{PS.m='bdead';sfx.bad();prender()},4000)}
 if(PS.m=='flick')cap.textContent='Экран мерцает: проблема со шлейфом';
 let b;
 if(pap=='home')b='<div class="tm">'+hm+'</div><div class="dt">'+t.toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'})+'</div><div class="ag">'+APPS.map(a=>'<button onclick="pgo(\''+a[0]+'\')">'+a[1]+'<small>'+a[2]+'</small></button>').join('')+'</div>';
 else if(pap=='clock'){b='<div class="ck2" id="pclk">'+t.toLocaleTimeString('ru')+'</div>'+back;pint=setInterval(()=>{const e=$('pclk');if(e)e.textContent=new Date().toLocaleTimeString('ru')},500)}
 else if(pap=='calc'){b='<div class="cd" id="cd">'+(pcx||'0')+'</div><div class="kp">'+['C','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','=',''].map(k=>k?'<button onclick="pk(\''+k+'\')">'+k+'</button>':'<span></span>').join('')+'</div>'+back}
 else if(pap=='cam'||pap=='self'){const ok=pap=='cam'?PS.cam:PS.selfie;b=ok?'<div class="vf">'+(pap=='cam'?'☀️':'🙂')+'<div class="shut" onclick="pshot()"></div></div><div class="dt">Снимков: '+pshots+'</div>'+back:'<div class="vf er">❌ Ошибка камеры<br>Модуль не отвечает</div>'+back}
 else if(pap=='snd')b='<div class="pc">🔊<br><button class="btn" onclick="[523,659,784,1047].forEach((f,i)=>beep(f,.2,\'triangle\',.1,i*.18))">Проверить динамик</button></div>'+back;
 else b=[['Модель',c.m],['Система',isRe()?'Android (старая прошивка)':'Android 14'],['Аккумулятор',PS.m=='batt'?'1%':'100%'],['Основная камера',PS.cam===false?'ошибка':'исправна'],['Фронтальная камера',PS.selfie===false?'ошибка':'исправна'],['Память','128 ГБ']].map(r=>'<div class="li"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('')+back;
 w.innerHTML='<div class="hs'+(PS.m=='flick'?' fk':'')+'">'+bar+b+'</div>'
}

function selftest(){
 const o=$('ov'),L=['Питание доходит до платы','Экран показывает изображение','Камера работает','Динамик звучит','Зарядка определяется','Сеть ловит','Все винты на месте'];
 o.className='on stm';o.innerHTML='<div class="box"><h3>Самотест</h3><div id="stl"></div></div>';
 L.forEach((t,i)=>setTimeout(()=>{$('stl').insertAdjacentHTML('beforeend','<p>✔ '+t+'</p>');beep(600+i*60,.06,'triangle')},400*(i+1)));
 setTimeout(()=>{$('stl').insertAdjacentHTML('afterend','<button class="btn g" id="stok">К верстаку</button>');
  $('stok').onclick=()=>{o.className='';o.innerHTML='';done(Math.round(BASE*KF[fIdx()]*MULT[instQ]*(1+.05*(lvl()-1))))}},400*(L.length+1))
}
function done(pay){
 if(S.cl.own){S.ph.push({id:S.cl.own,m:S.cl.m,k:null});S.xp+=25;S.q.rep++;save();sfx.ok();ui();toast('✅ Телефон починен и лежит в инвентаре. Продайте его на барахолке 🏪');newClient();return}
 S.money+=pay;S.xp+=25;S.q.rep++;S.q.earn+=pay;save();sfx.ok();ui();
 toast('✅ Ремонт завершён! +'+pay+' ₽');newClient()
}

/* ===== PHONES: cases, market, inventory ===== */
const VAL=[1000,1300,2000,2700,4500,6000,7500,1200,2300,3000,5000,7000];
const CP=[[0,1,7,2],[2,3,8,9,4],[4,5,6,10,11]],CW=[.1,.5,.85];
const uid=()=>(S.nid=(S.nid||0)+1),r10=x=>Math.round(x/10)*10;
const sellPrice=p=>r10((VAL[MODELS.indexOf(p.m)]||1000)*(p.k?.25:.9));
const stateTxt=p=>p.k?'❌ сломан: '+CMP[p.k]:'✅ исправен';
function rCases(){
 $('cs').innerHTML=CASES.map((c,i)=>'<button class="case" style="border-color:'+c.c+';color:'+c.c+'" onclick="openCase('+i+')"><b>📦</b>'+c.n+'<br>'+c.p+' ₽<br><small>рабочий: '+Math.round(CW[i]*100)+'%</small></button>').join('');
 $('inv').innerHTML=S.ph.length?S.ph.map(p=>'<span class="part '+(p.k?'q0':'q2')+'">📱 '+p.m+(p.k?' ❌':' ✅')+'</span>').join('')+'<br><button class="btn" onclick="go(7)">🎒 Открыть инвентарь</button>':'<br>Пусто';ui()
}
function openCase(i){
 const c=CASES[i];if(S.money<c.p){sfx.bad();toast('Не хватает денег');return}
 S.money-=c.p;const p={id:uid(),m:MODELS[CP[i][R(CP[i].length)]],k:Math.random()<CW[i]?null:KINDS[R(KINDS.length)]};
 S.ph.push(p);save();sfx.buy();setTimeout(sfx.ok,150);
 toast('📦 Выпал: '+p.m+' — '+(p.k?'сломан':'исправен'));rCases()
}
function phoneCard(p,ctx){
 return '<div class="card"><b>📱 '+p.m+'</b><br>'+stateTxt(p)+'<br><small>Цена продажи: '+sellPrice(p)+' ₽</small><div>'+(p.k?'<button class="btn g" onclick="toBench('+p.id+')">🔧 В ремонт</button>':'')+'<button class="btn" onclick="sellPhone('+p.id+',\''+ctx+'\')">💰 Продать</button></div></div>'
}
function toBench(id){
 if(S.cl.own)return toast('Сначала закончите ремонт своего телефона');
 const i=S.ph.findIndex(p=>p.id==id);if(i<0)return;const p=S.ph.splice(i,1)[0];
 S.cl={m:p.m,k:p.k,own:p.id};save();buildPhone();go(0);toast('Телефон на верстаке 🔧')
}
function sellPhone(id,ctx){
 const i=S.ph.findIndex(p=>p.id==id);if(i<0)return;const p=S.ph.splice(i,1)[0],v=sellPrice(p);
 S.money+=v;S.q.earn+=v;save();sfx.buy();toast('Продано: '+p.m+' за '+v+' ₽');if(ctx=='m')rMarket();else rInv()
}
function mkNew(){S.mk={day:new Date().toDateString(),items:Array.from({length:8},()=>{const i=R(12),w=Math.random()<.45,v=VAL[i];return{id:uid(),m:MODELS[i],k:w?null:KINDS[R(KINDS.length)],p:r10(v*(w?.95+Math.random()*.25:.28+Math.random()*.15))}})};save()}
function rMarket(){
 if(!S.mk||S.mk.day!==new Date().toDateString())mkNew();
 $('mk').innerHTML='<div class="card"><b>🏪 Барахолка</b><br><small>Здесь продают сломанные и починенные телефоны. Сломанные дешевле: купи, почини и продай дороже.</small><br><button class="btn" onclick="mkNew();rMarket()">🔄 Обновить объявления</button></div>'
  +S.mk.items.map(it=>'<div class="card"><b>📱 '+it.m+'</b><br>'+stateTxt(it)+'<div class="q"><b>'+it.p+' ₽</b><button class="btn" onclick="buyPhone('+it.id+')">Купить</button></div></div>').join('')
  +'<div class="card"><b>💰 Продать свои телефоны</b></div>'+(S.ph.length?S.ph.map(p=>phoneCard(p,'m')).join(''):'<div class="card">У вас нет телефонов. Купите здесь или откройте кейс 📦</div>');ui()
}
function buyPhone(id){
 const i=S.mk.items.findIndex(x=>x.id==id);if(i<0)return;const it=S.mk.items[i];
 if(S.money<it.p){sfx.bad();toast('Не хватает денег');return}
 S.money-=it.p;S.mk.items.splice(i,1);S.ph.push({id:it.id,m:it.m,k:it.k});save();sfx.buy();toast('Куплено: '+it.m);rMarket()
}
function rInv(){
 $('iv').innerHTML=(S.cl.own?'<div class="card">🔧 На верстаке: <b>'+S.cl.m+'</b> (в ремонте)</div>':'')+'<div class="card"><b>📱 Телефоны ('+S.ph.length+')</b></div>'+(S.ph.length?S.ph.map(p=>phoneCard(p,'i')).join(''):'<div class="card">Пусто. Откройте кейс 📦 или купите на барахолке 🏪</div>')
  +'<div class="card"><b>🔩 Запчасти ('+S.inv.length+')</b><div>'+(S.inv.length?S.inv.map(p=>'<span class="part q'+p.q+'">'+p.k+' · '+Q[p.q]+'</span>').join(''):'<br>Пусто. Запчасти покупаются во вкладке «Запчасти» 🛒')+'</div></div>';ui()
}

/* ===== FIRMWARE ===== */
let site=null;
function rBrowser(){
 const re=S.cl.k=='reflash';
 let h='<div class="bar">🔒 '+(site?site.u:'start.page')+'</div>';
 if(!site)h+='<b>Скачать прошивку:</b>'+SITES.map((s,i)=>'<button class="site" onclick="pick('+i+')">🌐 '+s.u+'</button>').join('')+'<p style="margin-top:8px;color:#666">'+(re?'Клиент ждёт перепрошивку '+S.cl.m:'Сейчас клиент не просил перепрошивку.')+'</p>';
 else h+='<h3>'+site.u+'</h3><p>Прошивка для '+S.cl.m+'</p><div class="pr"><i id="pi"></i></div><button class="btn" id="dl" onclick="flash()">⬇ Скачать и прошить</button><button class="btn" style="background:#999" onclick="site=null;rBrowser()">← Назад</button>';
 $('br').innerHTML=h
}
function pick(i){site=SITES[i];sfx.click();rBrowser()}
function flash(){
 $('dl').disabled=true;let w=0;const iv=setInterval(()=>{w+=5;$('pi').style.width=w+'%';beep(300+w*5,.04,'square',.03);if(w>=100){clearInterval(iv);end()}},80);
 function end(){
  const s=site;site=null;
  if(Math.random()<s.v){virus();return}
  if(S.cl.k=='reflash')done(1500+lvl()*50);else{toast('Прошито, но клиент не просил 🤷');rBrowser()}
 }
}
function virus(){
 siren();sfx.bad();S.money=Math.max(0,S.money-1000);save();
 const o=$('br');o.classList.add('bsodw');o.innerHTML='<h1>:(</h1><p style="font-size:22px">Ваш телефон столкнулся с вирусом и нуждается в перезагрузке.</p><p style="margin-top:20px">VIRUS_DETECTED_0x0000666<br><br>Штраф: −1000 ₽</p>';
 setTimeout(()=>{o.classList.remove('bsodw');rBrowser();ui()},3200)
}

/* ===== QUESTS ===== */
const QS=[{id:0,t:'Починить 5 телефонов',k:'rep',n:5,r:1000},{id:1,t:'Заработать 5000 ₽',k:'earn',n:5000,r:1500},{id:2,t:'Купить 3 детали',k:'buy',n:3,r:700}];
function rQuests(){
 daily();
 $('qs').innerHTML=QS.map(q=>{const v=Math.min(S.q[q.k],q.n),ok=v>=q.n,dn=S.q.done.includes(q.id);
  return '<div class="card"><div class="q"><b>'+q.t+'</b><span>🎁 '+q.r+' ₽</span></div><div class="pb"><i style="width:'+v/q.n*100+'%"></i></div><div class="q" style="margin-top:6px"><small>'+v+' / '+q.n+'</small><button class="btn g" '+(ok&&!dn?'':'disabled')+' onclick="claim('+q.id+')">'+(dn?'Получено ✔':'Забрать')+'</button></div></div>'}).join('')+'<p style="text-align:center;color:#89a">Задания обновляются каждый день</p>';ui()
}
function claim(id){const q=QS[id];S.q.done.push(id);S.money+=q.r;S.xp+=40;save();sfx.ok();toast('+'+q.r+' ₽');rQuests()}

/* ===== 3D CUSTOM ===== */
let rot=-20;
function rCustom(){
 $('sw').innerHTML=COLORS.map(c=>'<span class="sw" style="background:'+c+';'+(c==S.color?'border-color:#fff':'')+'" onclick="setColor(\''+c+'\')"></span>').join('');
 const d=new Date();$('fc').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 $('bt').textContent=S.cl.m;$('bcam').innerHTML=cam(S.cl.m);ui()
}
$('cb').onclick=()=>{rot+=360;$('cb').style.transform='rotateY('+rot+'deg)';sfx.open()};
function setColor(c){S.color=c;save();sfx.click();rCustom()}

/* ===== CAMERAS ===== */
const ln=(x,y,s)=>'<i class="ln" style="left:'+x+'%;top:'+y+'%;width:'+s+'%"></i>';
const box=(l,t,w,ar,c,in_)=>'<div class="cam '+c+'" style="left:'+l+'%;top:'+t+'%;width:'+w+'%;aspect-ratio:'+ar+'">'+in_+'</div>';
function cam(m){
 const n=+(m.match(/\d+/)||[0])[0],x=/Xiaomi/.test(m);
 if(x){
  if(n==10)return box(8,7,34,'1/2.1','h',ln(10,3,80)+ln(31,41,38)+ln(31,61,38)+ln(31,80,38)+'<i class="fl" style="left:12%;top:55%"></i>');
  if(n==11)return box(6,7,74,'2.1/1','h',ln(3,4,44)+ln(52,6,20)+ln(52,52,20)+'<i class="rs" style="left:77%;top:10%;width:19%;height:80%"></i>');
  if(n==12)return box(6,7,56,'1/1','h c',ln(12,12,76)+'<i class="fl" style="left:80%;top:20%"></i>');
  if(n==13)return box(6,7,56,'1/1','h c',ln(8,8,40)+ln(52,8,40)+ln(8,52,40)+ln(52,52,40));
  return box(6,7,60,'1/1','h c',ln(6,6,54)+ln(64,10,28)+ln(64,42,28)+ln(30,66,28));
 }
 if(n==20)return box(8,7,30,'1/2.3','h',ln(15,5,70)+ln(15,36,70)+ln(15,67,70));
 if(n==21)return box(8,7,30,'1/2.3','s',ln(15,5,70)+ln(15,36,70)+ln(15,67,70));
 return box(8,7,24,'1/2.6','',ln(6,1,88)+ln(6,34,88)+ln(6,66,88));
}

/* ===== SHOP ===== */
const ICON={'Экран':'📱','Плата':'🟩','Батарея':'🔋','Камера':'📷','Фронталка':'🤳','Шлейф':'🔗'},PB={'Экран':400,'Плата':500,'Батарея':250,'Камера':350,'Фронталка':150,'Шлейф':100},QP=[.4,.8,1.5],QC=['#667','#2a6df4','#c98a10'];
const price=(k,q)=>Math.round(PB[k]*QP[q]);
function rShop(){
 $('sh').innerHTML=KINDS.map((k,i)=>'<div class="card"><b>'+ICON[k]+' '+k+'</b><br>'+Q.map((n,q)=>'<button class="btn" style="background:'+QC[q]+'" onclick="buyPart('+i+','+q+')">'+n+' · '+price(k,q)+' ₽</button>').join('')+'</div>').join('')+'<div class="card"><b>В инвентаре</b><div>'+(S.inv.length?S.inv.map(p=>'<span class="part q'+p.q+'">'+p.k+' · '+Q[p.q]+'</span>').join(''):'<br>Пусто')+'</div></div>';ui()
}
function buyPart(i,q){
 const k=KINDS[i],p=price(k,q);
 if(S.money<p){sfx.bad();toast('Не хватает денег');return}
 S.money-=p;S.inv.push({k,q});S.q.buy++;save();sfx.buy();toast('Куплено: '+k+' · '+Q[q]);rShop()
}

/* ===== START ===== */
daily();if(!S.cl)S.cl={m:MODELS[R(12)],k:KINDS[R(KINDS.length)]};
buildPhone();go(0);ui();
</script></body></html>
