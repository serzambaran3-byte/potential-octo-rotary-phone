<style>

/* ===== AVITO / BAZARO MARKET ===== */
.av{background:#f2f4f7;color:#1a1a1a;border-radius:0;margin:-10px -12px;padding:0 0 20px;min-height:100%}
.av *{box-sizing:border-box}

.av-brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

.av-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px}
.av-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px #0001;cursor:pointer}
.av-card .pic{height:160px;background:#e8ecf2;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.av-card .pic .bg{position:absolute;inset:0;background:linear-gradient(145deg,#c4a882,#8b6b4a)}

.av-card .pic .bg.w{background:linear-gradient(145deg,#eef1f5,#c8ced8)}
.av-card .pic .phv{position:relative;width:72px;height:140px;border-radius:12px;border:3px solid #222;background:#111;overflow:hidden;box-shadow:0 6px 16px #0005}
.av-card .pic .phv .scr{position:absolute;inset:4px;border-radius:8px;background:linear-gradient(160deg,#1a2a4a,#0a1020);display:flex;flex-direction:column;align-items:center;padding-top:18px}

.av-card .pic .phv .scr .icons{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;width:80%}
.av-card .pic .phv .scr .icons i{display:block;aspect-ratio:1;border-radius:6px;background:#fff3}
.av-card .pic .badge{position:absolute;top:8px;left:8px;background:#000a;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px}

const CMP_ACC={'Нет звука':'нет звука в левом наушнике','Треск в динамике':'треск в правом наушнике','Не подключаются':'не подключаются по Bluetooth','Не заряжаются':'не заряжаются в кейсе','Села батарея кейса':'кейс не держит заряд','Разбит экран':'разбит дисплей','Не включаются':'часы не включаются','Села батарея':'быстро садится аккумулятор','Не считает шаги':'не считает шаги','Не меряет пульс':'датчик пульса не отвечает'};
function isAcc(){return S.cl&&(S.cl.t==='headphones'||S.cl.t==='watch')}
function accPartList(){return S.cl.t==='headphones'?HP_PARTS:WT_PARTS}
function accPartPrices(){return S.cl.t==='headphones'?HP_PART_PRICE:WT_PART_PRICE}
function accBrokenIdx(){const m=S.cl.t==='headphones'?HP_DEF_TO_PART:WT_DEF_TO_PART;return m[S.cl.k]??0}
function accFixCost(){const prices=accPartPrices(),i=accBrokenIdx();return prices[i]||1000}
function accPartKey(i){return (S.cl.t==='headphones'?'hp:':'wt:')+accPartList()[i]}
let accStage=0,accHeat=0,accScrews=4,accLid=false,accScOn=[1,1,1,1],accSt=[1,1,1,1,1],accFixedPart=false;
function resetAcc(){accStage=0;accHeat=0;accScrews=4;accLid=false;found=false;fixed=false;accScOn=[1,1,1,1];accSt=[1,1,1,1,1];accFixedPart=false}
function newClient(){
 const r=Math.random();
 if(r<1/3){const i=R(HP_MODELS.length),k=HP_DEF[R(HP_DEF.length)];S.cl={t:'headphones',m:HP_MODELS[i],k};}
 else if(r<2/3){const i=R(WT_MODELS.length),k=WT_DEF[R(WT_DEF.length)];S.cl={t:'watch',m:WT_MODELS[i],k};}
 else S.cl={t:'phone',m:MODELS[R(MODELS.length)],k:Math.random()<.25?'reflash':KINDS[R(KINDS.length)]};
 resetAcc();save();if(S.cl.t==='phone'){buildPhone()}else{if(window.reset3d)reset3d()}rRepair();if(window.sync3d)setTimeout(function(){try{sync3d()}catch(e){}},80)
}
function probeAcc(){
 if(!isAcc())return;
 if(tool!=='tester')return toast('Выберите Тестер 🔍');
 found=true;accStage=0;accHeat=0;accScrews=4;accLid=false;sfx.bad();toast('Найдена неисправность: '+(CMP_ACC[S.cl.k]||S.cl.k)+' ❌ · деталь: '+accPartList()[accBrokenIdx()]);rRepair()
}
/* Наушники: фен → винты → крышка → …  Часы: винты → крышка → …  Инструменты как у телефона */
function needAccTool(){
 if(!isAcc())return null;
 if(!found)return 'tester';
 const hp=S.cl.t==='headphones';
 /* Наушники: 0 открыть кейс, 1 снять/поставить деталь, 2 закрыть, 3 готово
    Часы: 0 винты, 1 крышка, 2 внутр.винты, 3 деталь, 4 крышка, 5 винты, 6 готово */
 if(hp)return 'hand';
 if(accStage===0||accStage===2||accStage===5)return 'driver';
 if(accStage===1||accStage===3||accStage===4)return 'hand';
 return null;
}
function accAction(){
 if(!isAcc())return;
 if(!found)return probeAcc();
 const hp=S.cl.t==='headphones';
 /* ===== НАУШНИКИ: простое открытие кейса без отвёртки ===== */
 if(hp){
  if(tool!=='hand'&&tool!=='suction'&&tool!=='tester'){
   return toast('Для наушников нужна Рука ✋');
  }
  /* 0 — открыть кейс */
  if(accStage===0){
   accLid=true;accStage=1;sfx.open();toast('Кейс открыт — достаньте сломанную деталь');rRepair();return;
  }
  /* 1 — снять / поставить деталь */
  if(accStage===1){
   const bi=accBrokenIdx(), parts=accPartList(), key=accPartKey(bi);
   if(accSt[bi]&&!accFixedPart){
    accSt[bi]=0;sfx.open();toast('Снято: '+parts[bi]+' ❌ → в лоток');rRepair();return;
   }
   if(!accSt[bi]&&!accFixedPart){
    S.accParts=S.accParts||[];
    let ix=S.accParts.indexOf(key);
    if(ix<0){
     const cost=accFixCost();
     if(S.money<cost){sfx.bad();return toast('Нет «'+parts[bi]+'». Купите в Запчастях или нужно '+cost+' ₽')}
     S.money-=cost;S.accParts.push(key);save();
    }
    ix=S.accParts.indexOf(key);if(ix>=0)S.accParts.splice(ix,1);
    accSt[bi]=1;accFixedPart=true;fixed=true;save();sfx.ok();toast('Установлено: '+parts[bi]+' ✅');rRepair();return;
   }
   /* деталь стоит — закрываем */
   accLid=false;accStage=2;sfx.open();toast('Кейс закрыт');rRepair();return;
  }
  /* 2 — завершить */
  if(accStage>=2){
   const pay=Math.round(accFixCost()*1.8*(1+.04*(lvl()-1)));done(pay);return;
  }
  return;
 }
 /* ===== ЧАСЫ: как раньше с винтами ===== */
 const need=needAccTool();
 const okTool=tool===need||(need==='hand'&&(tool==='hand'||tool==='suction'));
 if(need&&!okTool){
  const names={tester:'Тестер 🔍',driver:'Отвёртка 🪛',hand:'Рука ✋'};
  return toast('Нужен: '+(names[need]||need));
 }
 if(accStage===0){if(accScrews>0){accScrews--;sfx.screw();if(accScrews===0){accStage++;toast('Винты сняты — снимите крышку')}else toast('Винт · ост. '+accScrews);rRepair();return}}
 if(accStage===1){accLid=true;accScrews=4;accStage++;sfx.open();toast('Крышка снята');rRepair();return}
 if(accStage===2){if(accScrews>0){accScrews--;sfx.screw();if(accScrews===0){accStage++;toast('Внутренние винты сняты')}else toast('Винт · ост. '+accScrews);rRepair();return}}
 if(accStage===3){
  const bi=accBrokenIdx(), parts=accPartList(), key=accPartKey(bi);
  if(accSt[bi]&&!accFixedPart){accSt[bi]=0;sfx.open();toast('Снято: '+parts[bi]+' → в лоток');rRepair();return}
  if(!accSt[bi]&&!accFixedPart){
   S.accParts=S.accParts||[];
   let ix=S.accParts.indexOf(key);
   if(ix<0){const cost=accFixCost();if(S.money<cost){sfx.bad();return toast('Нет «'+parts[bi]+'» ('+cost+' ₽)')}S.money-=cost;S.accParts.push(key);save()}
   ix=S.accParts.indexOf(key);if(ix>=0)S.accParts.splice(ix,1);
   accSt[bi]=1;accFixedPart=true;fixed=true;save();sfx.ok();toast('Установлено: '+parts[bi]);rRepair();return
  }
  accStage++;rRepair();return
 }
 if(accStage===4){accLid=false;accScOn=[0,0,0,0];accScrews=0;accStage++;sfx.open();toast('Крышка на месте — закрутите винты');rRepair();return}
 if(accStage===5){if(accScrews<4)return toast('Закрутите винты 🪛 ('+accScrews+'/4)');accStage++;rRepair();return}
 if(accStage>=6){const pay=Math.round(accFixCost()*1.8*(1+.04*(lvl()-1)));done(pay)}
}

function accBtnLabel(){
 if(!found)return '🔍 Проверить поломку';
 const hp=S.cl.t==='headphones',step=accStage;
 if(hp&&step===0)return '🔥 Нагреть феном ('+accHeat+'/3)';
 if(step===(hp?1:0)||step===(hp?3:2))return '🪛 Выкрутить винт (ост. '+accScrews+')';
 if(step===(hp?2:1))return '🧰 Снять крышку';
 if(step===(hp?4:3))return '🔧 Установить запчасть';
 if(step===(hp?5:4))return '📦 Закрыть корпус';
 return '✅ Завершить ремонт';
}
function renderAccBench(){
 if(window.showDev3d)try{showDev3d()}catch(e){}
 if(window.sync3d)sync3d();
}
function buildPhone(){
 screws=3;stg=0;fixed=false;found=false;front=false;heat=0;scrFront=false;scSet(1);testing=false;okd=new Set();gl={};st=KINDS.map(()=>1);
 if(window.reset3d)reset3d()
}
function probe(i){
 if(i==fIdx()){found=true;sfx.bad();toast(KINDS[i]+': 0 Ом, замыкание ❌'+(i==0?'. Поверните телефон, чтобы поменять экран 🔄':''))}else{okd.add(i);sfx.click();toast(KINDS[i]+': 12 Ом, норма ✅')}rRepair()
}
function partTap(i){
 if(isRe()||stg<2||front)return;const fi=fIdx();
 if(tool=='tester'){if(st[i])probe(i);return}
 if(tool=='driver')return toast(i==1?'Нажмите прямо на винт платы':'Винты есть только у платы');
 if(tool=='glue'){if(!st[i]&&(i==0||i==2)){gl[i]=1;sfx.screw();toast('Клей нанесён 🧴');return rRepair()}if(fixed&&st.every(x=>x)&&bsc==4)return;return toast('Клей нужен только для АКБ, экрана и крышки')}
 if(tool=='suction'&&fixed&&st.every(x=>x)&&bsc==4)return;
 if(tool!='hand')return toast('Здесь нужна Рука ✋');
 if(st[i]){
  if(fixed)return;
  if(i==1&&bsc>0)return toast('Выкрутите винты платы 🪛 ('+bsc+')');
  if(blk(i).length)return toast('Сначала снимите: '+nm(blk(i))+(i==0?' или снимите экран спереди 🔄':''));
  st[i]=0;gl[i]=0;sfx.open();return rRepair()}
 return toast('Перетащите деталь из лотка 🧰 на телефон')
}
function fvTap(){
 if(isRe())return;const fi=fIdx();
 if(tool=='tester'){if(st[0])probe(0);return}
 if(tool=='fen'){if(!st[0]||fixed)return;heat=Math.min(3,heat+1);sfx.screw();toast(heat<3?'Греем… '+heat+'/3 🔥':'Клей размягчён 🔥');return rRepair()}
 if(tool=='suction'){if(!st[0]||fixed)return;if(heat<3)return toast('Экран приклеен — прогрейте Феном 🔥');st[0]=0;gl[0]=0;scrFront=true;sfx.open();return rRepair()}
 if(tool=='glue'&&!st[0]){gl[0]=1;sfx.screw();toast('Клей нанесён 🧴');return rRepair()}
 if(tool=='hand'&&!st[0])return toast('Перетащите экран из лотка 🧰 на телефон')
}
const TS=[[22,44],[44,38],[50,32],[38,38],[30,30],[72,18],[36,24],[30,20]];
function put(j){
 if(j==fIdx()&&!fixed)return toast('Эта деталь неисправна — нужна новая');
 if((j==0||j==2)&&!gl[j])return toast('Сначала нанесите клей 🧴 на место детали');
 if(blk(j).length&&!(j==0&&scrFront))return toast('Сначала снимите: '+nm(blk(j)));
 st[j]=1;gl[j]=0;if(j==1)scSet(0);if(j==0){heat=0;scrFront=false}sfx.ok();rRepair()
}
function dragP(e,j){
 e.preventDefault();const g=document.createElement('div');g.className='part';
 g.style.cssText='position:fixed;z-index:20;pointer-events:none;background:#345;transform:translate(-50%,-50%)';g.textContent=KINDS[j];document.body.appendChild(g);
 const mv=ev=>{g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'};mv(e);
 const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);g.remove();
  const t=document.elementFromPoint(ev.clientX,ev.clientY);
  if(t&&t.closest('.ph')&&(!front||j==0))put(j);else toast(front&&j!=0?'Переверните телефон 🔄':'Перетащите деталь на телефон')};
 addEventListener('pointermove',mv);addEventListener('pointerup',up)
}
function trayHTML(c,fi){
 if(stg<2&&st[0])return '';
 const gone=KINDS.map((_,j)=>j).filter(j=>!st[j]),th=(j,n)=>'<i class="ti" style="width:'+TS[j][0]+'px;height:'+TS[j][1]+'px">'+ART[j](n)+'</i>';
 let h='<div class="trayb"><b>🧰 Лоток</b><div class="tw">';
 gone.forEach(j=>{h+=(j==fi&&!fixed)?'<span class="part bad">'+th(j,0)+'❌ '+KINDS[j]+' (сломана)</span>':'<span class="part tp" onpointerdown="dragP(event,'+j+')">'+th(j,0)+KINDS[j]+'</span>'});
 if(stg==2)h+='<span class="part tp" onpointerdown="dragC(event)"><i class="ti" style="width:26px;height:46px;background:var(--c);border-radius:6px;border:1px solid #888"></i>Крышка</span>';
 if(!st[fi]&&!fixed){const L=S.inv.map((p,i)=>[p,i]).filter(x=>x[0].k==c.k);
  h+=L.map(x=>'<span class="part q'+x[0].q+' tp" onpointerdown="drag(event,'+x[1]+')">'+th(fi,4)+'новая · '+Q[x[0].q]+'</span>').join('');
  if(!L.length)h+='<div>❌ Нет новой детали «'+c.k+'». Купите её во вкладке «Запчасти» 🛒 или откройте кейс 📦.<br><button class="btn" onclick="go(6)">🛒 В магазин запчастей</button></div>'}
 if(!gone.length&&stg!=2)h+='<span style="color:#89a">Снятые детали появятся здесь</span>';
 return h+'</div></div>'
}
function putCover(){
 if(front)return toast('Переверните телефон 🔄');
 if(!(fixed&&st.every(x=>x)&&bsc==4))return toast('Сначала соберите телефон полностью');
 if(!gl.c)return toast('Нанесите клей на рамку 🧴');
 gl.c=0;stg=3;sfx.ok();rRepair()
}
function dragC(e){
 e.preventDefault();const g=document.createElement('div');g.className='part';
 g.style.cssText='position:fixed;z-index:20;pointer-events:none;background:#345;transform:translate(-50%,-50%)';g.textContent='Крышка';document.body.appendChild(g);

function place(i){

 if((fi==0||fi==2)&&!gl[fi])return toast('Сначала нанесите клей 🧴 на место детали');
 if(blk(fi).length&&!(fi==0&&scrFront))return toast('Сначала снимите: '+nm(blk(fi)));
 const q=S.inv.splice(i,1)[0];instQ=q.q;st[fi]=1;gl[fi]=0;fixed=true;heat=0;if(fi==1)scSet(0);sfx.ok();rRepair()

 addEventListener('pointermove',mv);addEventListener('pointerup',up)
}
function rRepair(){
 const c=S.cl,re=isRe(),fi=fIdx(),acc=isAcc();
 $('cl').dataset.m=c.m;
 const icon=c.t==='headphones'?'🎧':c.t==='watch'?'⌚':'📱';
 const complaint=re?'Просит <b>перепрошивку</b> 💻':('Жалоба: <b>'+((c.t==='phone'?CMP[c.k]:(CMP_ACC[c.k]||CMP[c.k]))||c.k)+'</b>');
 $('cl').innerHTML=(c.own?icon+' Ваше устройство: <b>':'👤 Клиент: <b>')+c.m+'</b><br>'+complaint;
 const pu=$('pu');if(pu){const hide=acc&&c.t!=='watch';pu.style.display=hide?'none':'';pu.innerHTML=c.t==='watch'?'⌚<small>Включить</small>':'📱<small>Включить</small>'}
 if(window.sync3d){const host=$('ph3');if(host)host.style.opacity='1';if(acc){renderAccBench()}else sync3d()}
 let h='',top='';
 if(acc){
  const hp=c.t==='headphones';
  const bi=accBrokenIdx(), pname=accPartList()[bi];
  const stages=hp
   ?['Нажмите на кейс — открыть','Достаньте «'+pname+'» в лоток / поставьте новую','Закройте кейс и завершите']
   :['Выкрутите 4 винта сзади','Снимите заднюю крышку','Выкрутите 4 внутренних винта','Снимите/замените: '+pname,'Закройте корпус','Закрутите 4 винта','Завершите ремонт'];
  const step=accStage;
  top=!found?'Заказ на '+(hp?'наушники':'часы')+'. Проверьте устройство.':(stages[Math.min(step,stages.length-1)]+(!hp&&(step===0||step===2||step===5)?' · винтов: '+accScrews+'/4':''));
  const need=needAccTool();
  const hint=!found?'Выберите Тестер 🔍 и нажмите на устройство'
   :(hp?(
     accStage===0?'Рука ✋ — нажмите на кейс, чтобы открыть'
     :accStage===1&&accSt[bi]&&!accFixedPart?'Рука ✋ — нажмите, чтобы вынуть «'+pname+'» в лоток'
     :accStage===1&&!accSt[bi]?'Рука ✋ — нажмите, чтобы поставить новую «'+pname+'»'
     :accStage===1?'Рука ✋ — нажмите, чтобы закрыть кейс'
     :'Нажмите, чтобы завершить ремонт'
    ):(
     need==='driver'?(accStage===5?'Отвёртка 🪛 — закрутите винты ('+accScrews+'/4)':'Отвёртка 🪛 — выкрутите винты ('+accScrews+'/4)')
     :need==='hand'&&!accLid?'Рука ✋ — снимите крышку'
     :need==='hand'&&fixed&&accLid?'Рука ✋ — поставьте крышку'
     :need==='hand'?'Рука ✋ — замените деталь'
     :accStage>=6?'Нажмите, чтобы завершить'
     :'Работайте по подсказке'
    ));
  $('hb').innerHTML='<div class="h1">Клиент · '+c.m+' · '+(CMP_ACC[c.k]||CMP[c.k]||c.k)+'</div><div class="h2">'+hint+'</div>';

   const bi=accBrokenIdx(), parts=accPartList(), key=accPartKey(bi), cost=accFixCost();
   const icons=['🎧','🎧','📶','🔌','🔋'];
   if(accStage===0)tray+='<span style="color:#9ab">Откройте кейс рукой ✋</span>';
   else if(accStage===1&&accSt[bi]&&!accFixedPart){
    tray+='<span class="part bad" onclick="accAction()">'+icons[bi]+' ❌ '+parts[bi]+'</span>';
    tray+='<small style="display:block;color:#9ab;margin-top:4px">Нажмите — вынуть в лоток</small>';

   tray+='</div>';
  }else if(accLid&&accStage===3){

   if(accSt[bi]&&!accFixedPart)tray+='<span class="part bad" onclick="accAction()">❌ '+parts[bi]+'</span>';

const ln=(x,y,s)=>'<i class="ln" style="left:'+x+'%;top:'+y+'%;width:'+s+'%"></i>';
const box=(l,t,w,ar,c,in_)=>'<div class="cam '+c+'" style="left:'+l+'%;top:'+t+'%;width:'+w+'%;aspect-ratio:'+ar+'">'+in_+'</div>';
function cam(m){
 const n=+(m.match(/\d+/)||[0])[0],x=/Xiaomi/.test(m);
 if(x){
  if(n==10)return box(8,7,34,'1/2.1','h',ln(10,3,80)+ln(31,41,38)+ln(31,61,38)+ln(31,80,38)+'<i class="fl" style="left:12%;top:55%"></i>');
  if(n==11)return box(6,7,74,'2.1/1','h',ln(3,4,44)+ln(52,6,20)+ln(52,52,20)+'<i class="rs" style="left:77%;top:10%;width:19%;height:80%"></i>');
  if(n==12)return box(6,7,56,'1/1','h c',ln(12,12,76)+'<i class="fl" style="left:80%;top:20%"></i>');
  if(n==13)return box(6,7,56,'1/1','h c',ln(8,8,40)+ln(52,8,40)+ln(8,52,40)+ln(52,52,40));
  return box(6,7,60,'1/1','h c',ln(6,6,54)+ln(64,10,28)+ln(64,42,28)+ln(30,66,28));
 }
 if(n==20)return box(8,7,30,'1/2.3','h',ln(15,5,70)+ln(15,36,70)+ln(15,67,70));
 if(n==21)return box(8,7,30,'1/2.3','s',ln(15,5,70)+ln(15,36,70)+ln(15,67,70));
 return box(8,7,24,'1/2.6','',ln(6,1,88)+ln(6,34,88)+ln(6,66,88));
}
