<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Phone Master Studio 4.0 · 3D</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--c:#2a6df4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:#0b0f1a;color-scheme:dark}
body{height:100%;background:#0b0f1a;color:#eef;font-family:system-ui,sans-serif;overflow:hidden}
#app{max-width:720px;height:100%;margin:auto;display:flex;flex-direction:column;background:linear-gradient(#121a30,#0b0f1a)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0006;font-weight:700;font-size:16px}
header .xp{flex:1;height:8px;background:#234;border-radius:4px;overflow:hidden}
header .xp i{display:block;height:100%;background:#4f8;width:0}
.ib{background:#234;border:0;color:#fff;border-radius:10px;padding:6px 9px;font-size:16px}
.ib.off{opacity:.35}
main{flex:1;overflow-y:auto;padding:10px 12px}
.tab{display:none}.tab.on{display:block}
nav{display:flex;background:#0008}
nav button{flex:1;padding:12px 0;background:none;border:0;color:#9ab;font-size:22px}
nav button.on{color:#fff;background:#2a6df433}
nav small{display:block;font-size:10px}
.card{background:#1a2440;border-radius:14px;padding:12px;margin:8px 0}
.btn{background:#2a6df4;color:#fff;border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:700;margin:3px}
.btn:disabled{opacity:.4}
.btn.g{background:#2ea44f}
.ph{position:relative;width:min(62vw,290px);aspect-ratio:9/17;margin:8px auto;border-radius:28px;background:#111;border:4px solid #444;overflow:hidden}
.in{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.slot{border-radius:8px;padding:12px;text-align:center;font-size:13px;font-weight:700;border:2px solid transparent}
.s0{background:#222;color:#8af;height:30%}.s1{background:#1b5e35;height:25%}.s2{background:#555;height:30%}
.need{border-color:#fc3;box-shadow:0 0 14px #fc3}
.bk{position:absolute;inset:0;background:var(--c);transition:transform 1.2s cubic-bezier(.6,0,.4,1);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;text-align:center;padding:10px;color:#fffd;text-shadow:0 2px 6px #0008}
.bk.open{transform:translateY(105%)}
.sc{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(#eee,#777);border:2px solid #333;transition:.45s;color:#333;font-weight:900;text-align:center;line-height:22px}
.sc::after{content:'+'}
.sc.gone{transform:scale(2.2) rotate(360deg);opacity:0;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.case{text-align:center;padding:14px 4px;border-radius:14px;border:2px solid;font-weight:700;background:#1a2440;color:#fff}
.case b{font-size:38px;display:block}
.part{display:inline-block;padding:6px 10px;margin:3px;border-radius:10px;background:#234;font-size:13px}
.q0{color:#aaa}.q1{color:#6cf}.q2{color:#fc3}
.cam{position:absolute;pointer-events:none;z-index:1}
.cam.h{background:#15161c;border:2px solid #3a3c46;border-radius:16px;box-shadow:0 2px 6px #0006}
.cam.c{border-radius:50%}
.cam.s{background:linear-gradient(#0004,#0004),var(--c);border-radius:14px;box-shadow:0 1px 4px #0005}
.ln{position:absolute;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6a7fb0 0,#1a2238 22%,#000 60%);border:2px solid #9aa;box-shadow:inset 0 0 0 3px #000,0 1px 3px #0008}
.rs{position:absolute;background:linear-gradient(135deg,#2a2d38,#000);border:1.5px solid #555;border-radius:6px}
.fl{position:absolute;aspect-ratio:1;border-radius:50%;background:#ffe9a8;width:7%}
.lap{background:#cfd4dc;border-radius:14px 14px 4px 4px;padding:10px;color:#000}
.lap .scr{background:#fff;border-radius:6px;min-height:250px;padding:8px;font-size:13px}
.lap .base{height:12px;background:#9aa2b0;margin:0 -16px;border-radius:0 0 14px 14px}
.bar{background:#eef;border-radius:6px;padding:5px 8px;margin-bottom:8px;font-size:12px;color:#235;word-break:break-all}
.site{display:block;width:100%;text-align:left;background:#eef;border:1px solid #bcd;border-radius:6px;padding:8px;margin:5px 0;font-size:13px;color:#036}
.pr{height:12px;background:#ddd;border-radius:6px;overflow:hidden;margin:8px 0}.pr i{display:block;height:100%;width:0;background:#2a6df4}
.scr.bsodw{background:#0078d7;color:#fff;animation:fl .4s infinite;text-align:left;padding:16px}
.bsodw h1{font-size:64px;font-weight:200}
.bsodw p{font-size:14px!important;line-height:1.4}
#wb{background-color:#17335c;background-image:repeating-linear-gradient(0deg,#ffffff0a 0 1px,transparent 1px 20px),repeating-linear-gradient(90deg,#ffffff0a 0 1px,transparent 1px 20px);border-radius:16px;padding:10px;margin:8px 0}
#wb .ph{margin:0 auto;box-shadow:0 8px 20px #0008}
.s1{background-image:radial-gradient(#9c6 1px,transparent 2px);background-size:12px 12px}
.slot.out{background:transparent!important;border:2px dashed #fc3!important;color:transparent!important}
.slot.tbad{border-color:#f44;box-shadow:0 0 14px #f44}
.slot.tok{border-color:#4f8}
.tbar{display:flex;gap:6px;margin-top:10px}
.tl{flex:1;background:#234;color:#cde;border:2px solid transparent;border-radius:10px;padding:8px 2px;font-size:20px}
.tl small{display:block;font-size:10px}
.tl.on{border-color:#fc3;background:#345}
.tp{touch-action:none;border:1px solid #fc3}
.stm{background:#000b}.stm .box{background:#1a2440;border-radius:16px;padding:18px;width:min(86%,360px);text-align:left}
.stm p{margin:6px 0}
#wb{position:relative}
#pu{position:absolute;right:8px;top:8px;z-index:6;background:#1a2440;border:2px solid #fc3;color:#fff;border-radius:12px;padding:6px 8px;font-size:22px}
#pu small{display:block;font-size:9px}
#pm{position:fixed;inset:0;z-index:8;display:none;background:#000c;align-items:center;justify-content:center}
#pm.on{display:flex}
.pz{display:flex;flex-direction:column;align-items:center;gap:10px;transform:scale(.25) translateY(25%);opacity:0;transition:transform .7s cubic-bezier(.2,.9,.2,1),opacity .5s}
.pz.big{transform:none;opacity:1}
.pf{position:relative;width:min(78vw,330px);aspect-ratio:9/18;border-radius:34px;border:6px solid #444;background:#000;overflow:hidden;box-shadow:0 10px 40px #000}
.pw{position:absolute;inset:0;display:flex;flex-direction:column}
.pn{position:absolute;top:10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#000;border:2px solid #556;z-index:3}
.pcap{max-width:min(78vw,330px);text-align:center;font-size:13px;color:#cde;min-height:34px}
.px{background:#e53935;border:0;color:#fff;border-radius:12px;padding:10px 18px;font-weight:700}
.sb{display:flex;justify-content:space-between;padding:8px 18px 0;font-size:12px}
.hs{flex:1;display:flex;flex-direction:column;background:linear-gradient(160deg,#2a4a7a,#1a1040 60%,#3a1050);position:relative;overflow:hidden}
.hs.fk{animation:fk .18s infinite}
@keyframes fk{50%{opacity:.3}}
.tm{font-size:54px;font-weight:200;text-align:center;margin-top:26px}
.dt{text-align:center;font-size:12px;opacity:.8}
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px 14px;margin-top:auto}
.ag button{background:#fff2;border:0;color:#fff;border-radius:16px;padding:10px 0;font-size:26px}
.ag small{display:block;font-size:9px}
.hb{position:absolute;bottom:6px;left:50%;width:90px;height:5px;margin-left:-45px;border-radius:3px;background:#fffa}
.pc{margin:auto;text-align:center;font-size:22px;padding:20px;color:#cde}
.pc.boot{font-size:20px;font-weight:700;letter-spacing:1px}
.blk{flex:1;background:#000}
.blk svg{width:100%;height:100%}
.ck2{margin:auto;font-size:40px;font-weight:200}
.cd{margin:34px 14px 8px;font-size:34px;text-align:right;min-height:46px;overflow:hidden}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 8px 20px}
.kp button{background:#fff2;border:0;color:#fff;border-radius:10px;padding:12px 0;font-size:18px}
.vf{flex:1;margin:34px 10px 10px;border-radius:14px;background:linear-gradient(#6bb7ff,#d8f0ff 60%,#7ab55c);display:flex;align-items:center;justify-content:center;font-size:56px;position:relative}
.vf.er{background:#000;font-size:14px;color:#f66;text-align:center;padding:10px}
.shut{position:absolute;bottom:10px;left:50%;width:44px;height:44px;margin-left:-22px;border-radius:50%;border:4px solid #fff;background:#fff4}
.li{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #fff2;font-size:13px}
.in{display:block;padding:0;z-index:1}
#cab{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.trayb{background:#10182e;border:2px dashed #4a5b86;border-radius:12px;padding:8px;margin-top:8px}
.tw .part{display:inline-flex;align-items:center;gap:6px}
.ti{display:inline-block}
.part.bad{opacity:.6}
.pt.out.glued{border-color:#ffd54f!important;box-shadow:inset 0 0 14px #ffd54f}
#wb .ph.gc{box-shadow:0 0 0 3px #ffd54f,0 8px 20px #0008}
.crk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fs.cr{overflow:hidden}.fs.cr .ck{opacity:.6}
.fs.fk{animation:fk .18s infinite}
.flipmsg{background:#5a3b00;border:2px solid #fc3;border-radius:12px;padding:10px;margin-bottom:8px;text-align:center;font-weight:700}
.pt svg{width:100%;height:100%;display:block;border-radius:inherit}
.bk{z-index:2}
.pt{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:700;border-radius:8px;border:2px solid transparent;transition:all .3s;color:#cde}
.p0{inset:5px;background:linear-gradient(160deg,#16203a,#06090f);color:#8af;border-radius:20px;z-index:0}
.p1{left:12%;top:24%;width:76%;height:34%;background:radial-gradient(#9c6 1px,transparent 2px) 0 0/12px 12px,#1b5e35;z-index:1}
.p2{left:12%;top:68%;width:76%;height:26%;background:#555;z-index:2}
.p3{left:10%;top:7%;width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#456,#000 70%);border-color:#889;z-index:2;font-size:16px}
.p4{left:58%;top:9%;width:20%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#456,#000 70%);border-color:#889;z-index:2;font-size:12px}
.p5{left:38%;top:59%;width:24%;height:7%;background:#e08a2a;z-index:3;font-size:10px;border-radius:4px}
.pt.out{background:#0004!important;border:2px dashed #fff5!important;color:#fff6!important}
.pt.need{border-color:#fc3!important;box-shadow:0 0 14px #fc3}
.pt.tbad{border-color:#f44;box-shadow:0 0 14px #f44}
.pt.tok{border-color:#4f8}
#fv{position:absolute;inset:0;z-index:4;display:none;background:#05070c}
#fv.on{display:block}
.fs{position:absolute;inset:6px;border-radius:22px;background:linear-gradient(160deg,#2a4a7a,#0a1020);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cde;transition:box-shadow .4s}
.fs.hot{box-shadow:inset 0 0 40px #f80,0 0 20px #f80}
.fs.off{background:#10131c;border:2px dashed #fff4;font-size:13px}
.ck{font-size:40px;font-weight:200}
.nt{position:absolute;top:12px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#000;border:2px solid #556}
.nt.no{border-style:dashed;border-color:#fc3}
.st{perspective:900px;height:360px;display:grid;place-items:center}
.cb{width:170px;height:330px;position:relative;transform-style:preserve-3d;transition:transform 1.4s;transform:rotateY(-20deg)}
.fc,.bc{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;border:5px solid #222}
.fc{background:linear-gradient(160deg,#16304f,#050a14);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:200}
.bc{transform:rotateY(180deg);background:var(--c);display:flex;align-items:center;justify-content:center;font-weight:800;text-align:center;color:#fffc}
.sw{display:inline-block;width:44px;height:44px;border-radius:50%;margin:5px;border:3px solid #fff4}
.q{display:flex;justify-content:space-between;align-items:center}
.pb{height:8px;background:#234;border-radius:4px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:#4f8}
#ov{position:fixed;inset:0;display:none;z-index:9;align-items:center;justify-content:center;text-align:center}
#ov.on{display:flex}
.lock{background:linear-gradient(#1b2a5a,#2a0d3a);flex-direction:column;gap:20px;color:#fff}
.lock .t{font-size:84px;font-weight:200}
.lock .n{background:#fff2;border-radius:16px;padding:14px 22px;max-width:80%;backdrop-filter:blur(8px)}
.bsod{background:#0078d7;color:#fff;flex-direction:column;padding:30px;align-items:flex-start;text-align:left;animation:fl .4s infinite}
.bsod h1{font-size:90px;font-weight:200}
@keyframes fl{50%{background:#0a5fb0}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;z-index:10;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
#wb .ph{width:100%;aspect-ratio:auto;height:min(66vh,560px);border:0;border-radius:14px;margin:0;background:#0d0a08;overflow:hidden;position:relative;box-shadow:none}
#ph3 canvas{width:100%;height:100%;display:block}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;display:inline-block;flex:none}
#act:empty{display:none}
#hb{position:absolute;left:0;right:0;top:0;z-index:3;pointer-events:none;background:linear-gradient(#000d,#0000);padding:8px 10px 20px;font-size:13px}
#hb .h1{font-weight:800;border-left:4px solid #ff9a3c;padding-left:8px;margin-bottom:3px}
#hb .h2{padding-left:12px}
#tb{position:absolute;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(#0000,#000d 40%);padding-top:16px}
#tb .tools{display:flex;gap:3px;overflow-x:auto;padding:4px 6px 6px}
.tl2{flex:0 0 auto;min-width:58px;background:#1a2440;color:#cde;border:0;border-top:3px solid transparent;border-radius:8px;padding:6px 4px;font-size:20px}
.tl2 small{display:block;font-size:10px}
.tl2.on{border-top-color:#ff9a3c;background:#2c3a60;color:#fff}
.bits{display:flex;gap:6px;padding:0 8px 4px}
.bt{background:#ffb30033;border:2px solid #ffb300;color:#ffe;border-radius:14px;padding:4px 10px;font-size:12px;font-weight:700}
.bt.on{background:#ffb300;color:#000}
#rg{position:absolute;width:120px;height:120px;display:none;z-index:4;touch-action:none}
#rg svg{width:100%;height:100%}
.rb{fill:#0006;stroke:#ffffff55;stroke-width:6}
.rp{fill:none;stroke:#ff9a3c;stroke-width:6;stroke-dasharray:301.6;stroke-dashoffset:301.6;stroke-linecap:round}
#rg small{position:absolute;left:-24px;right:-24px;top:124px;text-align:center;font-size:11px;background:#000a;border-radius:8px;padding:2px 6px}
nav{overflow-x:auto}nav::-webkit-scrollbar{display:none}nav button{flex:1 0 66px}
.hschema{position:relative;width:min(92vw,340px);height:520px;margin:12px auto;background:#0d1220;border-radius:18px;border:2px solid #2a3a5a;overflow:hidden}
.hschema .phone{position:absolute;left:50%;top:20px;width:150px;height:300px;margin-left:-75px;border-radius:22px;border:4px solid #555;background:linear-gradient(160deg,#1a2440,#0a1020);box-shadow:0 8px 24px #000a}
.hschema .partbox{position:absolute;border:1.5px solid;border-radius:6px;font-size:9px;font-weight:700;text-align:center;padding:2px 1px;line-height:1.15;color:#eef;pointer-events:none}
.hschema .arrow{position:absolute;pointer-events:none}
.hschema .arrow line{stroke:#ff9a3c;stroke-width:2;marker-end:url(#arr)}
.hschema .lbl{position:absolute;font-size:11px;font-weight:700;color:#ffd54f;white-space:nowrap;text-shadow:0 1px 3px #000;pointer-events:none}
.hschema .lbl small{display:block;font-weight:400;color:#9ab;font-size:9px}
.tut{position:fixed;inset:0;z-index:20;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px}
.tut .box{background:#1a2440;border-radius:16px;padding:18px;max-width:360px;width:100%;border:2px solid #ff9a3c}
.tut .box h3{margin:0 0 8px;color:#ffd54f}
.tut .box p{margin:6px 0;line-height:1.4;font-size:14px}
.tut .box .steps{margin:10px 0;padding-left:18px;font-size:13px;color:#cde}
.tut .nav{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
/* ===== AVITO / BAZARO MARKET ===== */
.av{background:#f2f4f7;color:#1a1a1a;border-radius:0;margin:-10px -12px;padding:0 0 20px;min-height:100%}
.av *{box-sizing:border-box}
.av-top{background:#fff;padding:10px 12px 8px;border-bottom:1px solid #e5e8ee;position:sticky;top:0;z-index:2}
.av-brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.av-logo{font-weight:800;font-size:20px;color:#00aaff;letter-spacing:-.5px}
.av-logo span{color:#ff6163}
.av-bal{font-size:12px;text-align:right;color:#333}
.av-bal b{font-size:14px}
.av-search{width:100%;padding:10px 14px;border:1px solid #d0d5dd;border-radius:24px;font-size:14px;background:#f7f8fa;color:#333}
.av-chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.av-chips::-webkit-scrollbar{display:none}
.av-chip{flex:0 0 auto;padding:6px 12px;border-radius:20px;border:1px solid #d0d5dd;background:#fff;font-size:12px;color:#333;font-weight:600}
.av-chip.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.av-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px}
.av-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px #0001;cursor:pointer}
.av-card .pic{height:160px;background:#e8ecf2;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.av-card .pic .bg{position:absolute;inset:0;background:linear-gradient(145deg,#c4a882,#8b6b4a)}
.av-card .pic .bg.g{background:linear-gradient(145deg,#d0d5dc,#9aa3b0)}
.av-card .pic .bg.w{background:linear-gradient(145deg,#eef1f5,#c8ced8)}
.av-card .pic .phv{position:relative;width:72px;height:140px;border-radius:12px;border:3px solid #222;background:#111;overflow:hidden;box-shadow:0 6px 16px #0005}
.av-card .pic .phv .scr{position:absolute;inset:4px;border-radius:8px;background:linear-gradient(160deg,#1a2a4a,#0a1020);display:flex;flex-direction:column;align-items:center;padding-top:18px}
.av-card .pic .phv .scr .tm{font-size:14px;font-weight:200;color:#fff;letter-spacing:1px}
.av-card .pic .phv .scr .icons{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;width:80%}
.av-card .pic .phv .scr .icons i{display:block;aspect-ratio:1;border-radius:6px;background:#fff3}
.av-card .pic .badge{position:absolute;top:8px;left:8px;background:#000a;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px}
.av-card .info{padding:8px 10px 10px}
.av-card .price{font-weight:800;font-size:16px;color:#1a1a1a}
.av-card .title{font-size:12px;color:#333;margin-top:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.av-card .meta{font-size:10px;color:#888;margin-top:4px}
.av-card.broken .pic .phv .scr{background:#222}
.av-card.broken .pic .phv .scr::after{content:'❌';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;background:#0008}
.av-card.broken .pic:after{content:'❌ СЛОМАНО';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0006;color:#fff;font-size:18px;font-weight:900;text-shadow:0 2px 5px #000;letter-spacing:.5px}
.av-card.broken .pic .badge{z-index:1}
.av-sec{padding:8px 12px;font-weight:700;font-size:14px;color:#333}
.av-my{padding:0 12px 12px}
.av-my .av-card{margin-bottom:10px}
.av-btns{display:flex;gap:6px;margin-top:6px}
.av-btns button{flex:1;padding:7px 4px;border:0;border-radius:8px;font-size:12px;font-weight:700;background:#00aaff;color:#fff}
.av-btns button.g{background:#2ea44f}

if(!window.THREE||!THREE.OrbitControls)return;
const host=$('ph3'),div=document.createElement('div');
div.id='acc3';div.style.cssText='position:absolute;inset:0;z-index:1;display:none';host.appendChild(div);
const rd=new THREE.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.outputEncoding=THREE.sRGBEncoding;div.appendChild(rd.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x14100c);
const cm=new THREE.PerspectiveCamera(40,1,.1,100);
const ctl=new THREE.OrbitControls(cm,rd.domElement);ctl.enableDamping=true;ctl.enablePan=false;ctl.minDistance=6;ctl.maxDistance=18;ctl.maxPolarAngle=1.5;
const fit=()=>{const w=host.clientWidth,h=host.clientHeight;if(w&&h){rd.setSize(w,h);cm.aspect=w/h;cm.updateProjectionMatrix()}};
new ResizeObserver(fit).observe(host);
sc.add(new THREE.HemisphereLight(0xffe2b8,0x2a1a10,.9));
const sun=new THREE.DirectionalLight(0xffcf99,1.1);sun.position.set(5,9,4);sc.add(sun);
const lamp=new THREE.PointLight(0xff9a50,.8,30);lamp.position.set(-5,6,3);sc.add(lamp);
const M=(c,m,r,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:m,roughness:r},o||{}));
const mesh=(g,m,x,y,z,rx)=>{const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);if(rx)o.rotation.x=rx;return o};
const bench=mesh(new THREE.PlaneGeometry(40,40),M(0x5a3a22,0,.85),0,-.02,0,-Math.PI/2);sc.add(bench);
const root=new THREE.Group();sc.add(root);
const ez=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,an=[],tw=(d,f,done)=>an.push({t:0,d,f,done});
const T={cl:null,hp:true,i:0,heat:0,n:4,tool:'hand',seq:[],parts:[],sc:[],cap:null,ghost:null,fid:0};
const FID={'Нет звука':0,'Треск в динамике':0,'Не заряжаются':1,'Не подключаются':2,'Разбит экран':0,'Не считает шаги':1,'Не включаются':2,'Села батарея':3};
const TN={fen:'Фен 🔥',driver:'Отвёртка 🪛',hand:'Рука ✋'};
const TL={hp:[['fen','🔥','Фен'],['hand','✋','Рука']],wt:[['driver','🪛','Отвёртка'],['hand','✋','Рука']]};
const part=(id,ms,x,y,z)=>{const g=new THREE.Group();g.userData={id};g.position.set(x,y,z);ms.forEach(m=>g.add(m));g.userData.home=g.position.clone();g.userData.mats=[];g.traverse(o=>{if(o.material)g.userData.mats.push(o.material)});root.add(g);T.parts[id]=g};
function mv(o,p,rz,d){const a=o.position.clone(),r=o.rotation.z;tw(d||.7,k=>{const e=ez(k);o.position.lerpVectors(a,p,e);o.rotation.z=r+(rz-r)*e})}

/* --- наушник (увеличенный): крышка сидит на клею, греем феном --- */
function bHP(){
 const sh=M(0xeef0f4,.2,.3,{side:THREE.DoubleSide});
 root.add(mesh(new THREE.SphereGeometry(1.7,40,20,0,6.2832,1.5708,1.5708),sh));
 root.add(mesh(new THREE.CylinderGeometry(.5,.45,2.2,24),sh,0,-2.3,0));
 root.add(mesh(new THREE.TorusGeometry(1.7,.04,8,48),M(0x888e99,.8,.3),0,0,0,1.5708));
 T.capM=M(0xeef0f4,.2,.3,{side:THREE.DoubleSide,emissive:0xff5a00,emissiveIntensity:0});
 const cap=new THREE.Group();cap.userData={id:'cap'};
 cap.add(mesh(new THREE.SphereGeometry(1.7,40,20,0,6.2832,0,1.5708),T.capM));
 cap.add(mesh(new THREE.CylinderGeometry(.5,.5,.05,24),M(0x222222,.3,.5),0,1.69,0));
 root.add(cap);T.cap=cap;T.home=new THREE.Vector3(0,0,0);T.away=new THREE.Vector3(3.6,2.2,0);T.arz=-.6;
 part(0,[mesh(new THREE.CylinderGeometry(.8,.8,.3,32),M(0x2a2d34,.6,.4)),mesh(new THREE.CylinderGeometry(.5,.5,.32,32),M(0xc9a23a,.8,.3))],0,-.35,0);
 part(1,[mesh(new THREE.CylinderGeometry(.1,.1,.25,16),M(0xd4a62a,1,.2),-.35,0,0),mesh(new THREE.CylinderGeometry(.1,.1,.25,16),M(0xd4a62a,1,.2),.35,0,0)],0,-1.1,1);
 part(2,[mesh(new THREE.BoxGeometry(1.1,.12,.7),M(0x1f7a3a,.2,.6)),mesh(new THREE.BoxGeometry(.4,.1,.4),M(0x15161a,.3,.4),0,.1,0)],-.8,-.7,-.5);
 part(3,[mesh(new THREE.CylinderGeometry(.35,.35,.5,20),M(0xcfd5dc,.8,.3))],1,-.9,-.3);
 const d=new THREE.Group();
 d.add(mesh(new THREE.CylinderGeometry(.5,.5,1.6,20),M(0x2a6df4,.3,.5),0,0,0,1.5708),mesh(new THREE.CylinderGeometry(.38,.5,.6,20),M(0x888888,.5,.4),0,0,1,1.5708),mesh(new THREE.BoxGeometry(.3,.9,.3),M(0x222222,.2,.6),0,-.8,-.3));
 d.position.set(3.6,3,2);d.lookAt(0,1.4,0);root.add(d);T.dryer=d;
}
/* --- часы: лежат лицом вниз, на задней крышке 4 винта --- */
function bWT(){
 root.add(mesh(new THREE.CylinderGeometry(2,2,.8,48,1,true),M(0xb9c0cb,.9,.3,{side:THREE.DoubleSide}),0,.4,0));
 root.add(mesh(new THREE.TorusGeometry(1.97,.07,10,48),M(0xdfe5ee,1,.2),0,.8,0,1.5708));
 [-1,1].forEach(s=>root.add(mesh(new THREE.BoxGeometry(1.6,.3,2.4),M(0x222831,0,.8),0,.2,s*3.2)));
 part(0,[mesh(new THREE.CylinderGeometry(1.8,1.8,.08,40),M(0x0b1a33,.4,.2))],0,.1,0);
 part(1,[mesh(new THREE.BoxGeometry(.6,.15,.6),M(0x15161a,.3,.4))],-.9,.3,-.8);
 part(2,[mesh(new THREE.BoxGeometry(1.6,.12,1),M(0x1f7a3a,.2,.6)),mesh(new THREE.BoxGeometry(.5,.1,.5),M(0xc4cad3,1,.3),-.3,.1,0)],-.7,.25,.7);
 part(3,[mesh(new THREE.CylinderGeometry(.7,.7,.25,32),M(0xcfd5dc,.8,.3))],.7,.3,-.5);
 const cap=new THREE.Group();cap.userData={id:'cap'};
 cap.add(mesh(new THREE.CylinderGeometry(1.95,1.95,.1,48),M(0x9aa2ad,.9,.3)),mesh(new THREE.CylinderGeometry(.8,.8,.05,32),M(0x111418,.3,.2),0,.07,0),mesh(new THREE.SphereGeometry(.1,10,8),M(0x22ff88,0,.3,{emissive:0x22ff88}),-.3,.1,0),mesh(new THREE.SphereGeometry(.1,10,8),M(0x22ff88,0,.3,{emissive:0x22ff88}),.3,.1,0));
 cap.position.set(0,.85,0);root.add(cap);T.cap=cap;T.home=cap.position.clone();T.away=new THREE.Vector3(4.6,1.4,1.5);T.arz=.4;
 [[1,1],[-1,1],[1,-1],[-1,-1]].forEach((p,k)=>{
  const s=mesh(new THREE.CylinderGeometry(.17,.17,.08,16),M(0xcfd5dc,1,.25,{transparent:true}),p[0]*1.1,.94,p[1]*1.1);
  s.add(mesh(new THREE.BoxGeometry(.24,.02,.04),M(0x333333,.3,.6),0,.05,0));
  s.userData={id:'sc'+k,y:.94,out:false};root.add(s);T.sc.push(s)})
}
function build(){
 while(root.children.length)root.remove(root.children[0]);
 const c=S.cl,hp=c.t==='headphones';
 Object.assign(T,{hp,i:0,heat:0,n:4,parts:[],sc:[],ghost:null,dryer:null,capM:null,fid:FID[c.k]||0,
  tool:hp?'fen':'driver',seq:hp?['heat','open','out','in','close','fin']:['unscrew','open','out','in','close','screw','fin']});
 hp?bHP():bWT();
 bench.position.y=hp?-3.4:-.02;
 ctl.target.set(0,hp?-1.2:.4,0);cm.position.set(0,hp?5:9,hp?10:7);ctl.update()
}
/* --- подсказки и интерфейс --- */
function hint(){
 const s=T.seq[T.i];
 return {heat:'Выберите Фен 🔥 и нажмите на крышку наушника. Нагрев '+T.heat+'/3',
  open:T.hp?'Клей размягчён. Рукой ✋ нажмите на крышку, чтобы снять её':'Винты сняты. Рукой ✋ нажмите на заднюю крышку, чтобы снять её',
  unscrew:'Отвёрткой 🪛 нажмите на каждый винт крышки. Осталось: '+T.n,
  out:'Рукой ✋ нажмите на красную неисправную деталь «'+S.cl.k+'», чтобы вынуть',
  in:'Нажмите на жёлтый контур — встанет новая деталь из «Запчастей» 🛒',
  close:'Рукой ✋ нажмите на крышку, чтобы вернуть её на место',
  screw:'Отвёрткой 🪛 закрутите все винты. Осталось: '+T.n,
  fin:'Всё собрано! Завершите ремонт'}[s]
}
function accUI(){
 const c=S.cl,s=T.seq[T.i];
 $('hb').innerHTML='<div class="h1">'+(c.own?'Ваше устройство':'Клиент')+' · '+c.m+' · '+(CMP[c.k]||c.k)+'</div><div class="h2">'+(found?hint():'Нажмите «Проверить», чтобы найти неисправность')+'</div>';
 $('tb').innerHTML=found?'<div class="tools">'+TL[T.hp?'hp':'wt'].map(t=>'<button class="tl2'+(T.tool==t[0]?' on':'')+'" onclick="accTool(\''+t[0]+'\')">'+t[1]+'<small>'+t[2]+'</small></button>').join('')+'</div>':'';
 $('act').innerHTML='<div style="text-align:center">'+(!found?'<button class="btn" onclick="probeAcc()">🔍 Проверить</button>':s==='fin'?'<button class="btn g" onclick="accFinish()">✅ Завершить ремонт</button>':'<small>Шаг '+(T.i+1)+' из '+T.seq.length+' · вращайте устройство пальцем</small>')+'</div>'
}
/* --- действия --- */
function act(id,o){
 const s=T.seq[T.i],need=s==='heat'?'fen':(s==='unscrew'||s==='screw')?'driver':'hand',isSc=typeof id==='string'&&id.startsWith('sc');
 if(s==='fin')return toast('Нажмите «Завершить ремонт» ✅');
 if(T.tool!==need)return toast('Выберите инструмент: '+TN[need]);
 if(s==='heat'&&id==='cap'){T.heat++;T.capM.emissiveIntensity=T.heat*.3;sfx.screw();if(T.heat>=3){T.i++;toast('Клей размягчён 🔥')}else toast('Греем… '+T.heat+'/3 🔥')}
 else if(s==='open'&&id==='cap'){if(T.capM)T.capM.emissiveIntensity=0;mv(T.cap,T.away,T.arz);sfx.open();T.i++}
 else if(s==='unscrew'&&isSc&&!o.userData.out){o.userData.out=true;o.material.opacity=.55;const y0=o.position.y,r0=o.rotation.y;tw(.5,k=>{o.position.y=y0+.7*ez(k);o.rotation.y=r0-9*ez(k)});sfx.screw();if(--T.n===0){T.i++;toast('Все винты выкручены 🪛')}}
 else if(s==='screw'&&isSc&&o.userData.out){o.userData.out=false;o.material.opacity=1;const y0=o.position.y,r0=o.rotation.y;tw(.5,k=>{o.position.y=y0-.7*ez(k);o.rotation.y=r0+9*ez(k)});sfx.screw();if(--T.n===0){T.i++;toast('Часы закрыты ✅')}}
 else if(s==='out'&&typeof id==='number'){
  if(id!==T.fid){sfx.bad();return toast('Эта деталь исправна — ищите красную')}
  const g=T.parts[id],h=g.userData.home,b=new THREE.Box3().setFromObject(g),sz=b.getSize(new THREE.Vector3());
  const gh=mesh(new THREE.BoxGeometry(sz.x+.1,sz.y+.2,sz.z+.1),new THREE.MeshBasicMaterial({color:0xffd54f,wireframe:true,transparent:true,opacity:.7}));
  gh.position.copy(b.getCenter(new THREE.Vector3()));gh.userData={id:'gh'};root.add(gh);T.ghost=gh;
  tw(.6,k=>{g.position.y=h.y+3*ez(k)},()=>{g.visible=false});sfx.open();T.i++}
 else if(s==='in'&&id==='gh'){
  S.accParts=S.accParts||[];const ix=S.accParts.indexOf((T.hp?'hp:':'wt:')+S.cl.k);
  if(ix<0){sfx.bad();return toast('Нет запчасти. Купите во вкладке «Запчасти» 🛒')}
  S.accParts.splice(ix,1);save();root.remove(T.ghost);T.ghost=null;
  const g=T.parts[T.fid],h=g.userData.home;g.visible=true;tw(.6,k=>{g.position.y=h.y+3*(1-ez(k))});
  fixed=true;sfx.ok();toast('Новая деталь установлена ✅');T.i++}
 else if(s==='close'&&id==='cap'){mv(T.cap,T.home,0);sfx.open();T.i++;if(T.seq[T.i]==='screw')T.n=4}
 else return toast(hint());
 rRepair()
}
const ray=new THREE.Raycaster(),pt=new THREE.Vector2(),el=rd.domElement;let dn=null;
el.addEventListener('pointerdown',e=>dn={x:e.clientX,y:e.clientY,t:performance.now()});
el.addEventListener('pointerup',e=>{if(!dn)return;const ok=Math.hypot(e.clientX-dn.x,e.clientY-dn.y)<8&&performance.now()-dn.t<500;dn=null;if(ok)tap(e)});
function tap(e){
 if(!found)return toast('Сначала нажмите «Проверить» 🔍');
 const r=el.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(pt,cm);
 const tg=[T.cap,...T.sc,...T.parts.filter(p=>p.visible),T.ghost].filter(Boolean);
 const h=ray.intersectObjects(tg,true)[0];if(!h)return;
 let o=h.object;while(o&&o.userData.id===undefined)o=o.parent;if(o)act(o.userData.id,o)
}
/* --- цикл --- */
const clk=new THREE.Clock();let tm=0;
(function loop(){
 requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);tm+=dt;
 for(let i=an.length-1;i>=0;i--){const a=an[i];a.t+=dt/a.d;const k=Math.min(a.t,1);a.f(k);if(k>=1){an.splice(i,1);if(a.done)a.done()}}
 if(div.style.display==='none'||host.offsetParent===null)return;
 T.parts.forEach((g,i)=>{const bad=found&&!fixed&&i===T.fid&&g.visible;g.userData.mats.forEach(m=>{m.emissive.setHex(bad?0xff2020:0);m.emissiveIntensity=bad?.35+.3*Math.sin(tm*6):0})});
 if(T.dryer){T.dryer.visible=T.hp&&found&&T.seq[T.i]==='heat';T.dryer.position.x=3.6+.15*Math.sin(tm*9)}
 ctl.update();rd.render(sc,cm)
})();
/* --- подмена старых функций --- */
const pc=()=>host.querySelector(':scope > canvas');
renderAccBench=function(){if(T.cl!==S.cl){T.cl=S.cl;build()}const p=pc();if(p)p.style.display='none';div.style.display='block';fit()};
const _s=window.sync3d;window.sync3d=function(){div.style.display='none';const p=pc();if(p)p.style.display='block';if(_s)_s()};
const _rR=rRepair;rRepair=function(){_rR();if(isAcc())accUI()};
probeAcc=function(){if(!isAcc())return;found=true;fixed=false;T.cl=null;sfx.bad();toast('Найдена неисправность: '+S.cl.k+' ❌');rRepair()};
window.accTool=function(t){T.tool=t;sfx.click();accUI()};
window.accFinish=function(){done(Math.round(accFixCost()*1.8*(1+.04*(lvl()-1))))};
})();daily();if(!S.cl)S.cl={t:'phone',m:MODELS[R(MODELS.length)],k:KINDS[R(KINDS.length)]};
buildPhone();go(0);ui();iconify(document.body);
if(!S.tutDone)setTimeout(startTutorial,800);
</script></body></html>
