        <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ремонт телефонов</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; background: white; font-family: Arial, sans-serif; text-align: center; color: #222; }
    h1 { margin-top: 30px; }
    #money { font-size: 28px; font-weight: bold; color: #16a34a; margin: 25px; }
    .phone { width: 190px; height: 350px; background: #222; border: 8px solid #111; border-radius: 30px; margin: 40px auto; cursor: pointer; position: relative; transition: transform 0.1s; box-shadow: 0 8px 20px #0003; }
    .phone:active { transform: scale(0.94); }
    .screen { background: linear-gradient(145deg, #60a5fa, #2563eb); width: 100%; height: 100%; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 35px; }
    .camera { position: absolute; width: 45px; height: 6px; background: #111; border-radius: 10px; top: 5px; left: 50%; transform: translateX(-50%); z-index: 2; }
    .hint { color: #777; font-size: 17px; }
    button { background: #2563eb; color: white; border: none; padding: 15px 25px; border-radius: 12px; font-size: 17px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #clickText { height: 25px; color: #16a34a; font-weight: bold; }
</style>
</head>
<body>

<h1>🔧 Ремонт телефонов</h1>
<div id="money">Деньги: 0 ₽</div>

<div class="phone" onclick="clickPhone()">
    <div class="camera"></div>
    <div class="screen">📱</div>
</div>

<p class="hint">Нажимай на телефон, чтобы ремонтировать его!</p>
<p id="clickText"></p>

<button onclick="resetGame()">Сбросить игру</button>

<script>
    let money = 0;

    function clickPhone() {
        money += 10;
        document.getElementById("money").textContent = "Деньги: " + money + " ₽";
        document.getElementById("clickText").textContent = "+10 ₽ 💰";
    }

    function resetGame() {
        money = 0;
        document.getElementById("money").textContent = "Деньги: 0 ₽";
        document.getElementById("clickText").textContent = "";
    }
</script>
</body>
</html>
